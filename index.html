<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noel PN | AI/ML Portfolio</title>
<style>
:root{--bg:#0f1420;--panel:#171e2e;--line:#27314a;--text:#e8ecf5;--muted:#9aa6c0;--accent:#7cc4ff}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:"Segoe UI",system-ui,-apple-system,sans-serif;line-height:1.65}
a{color:var(--accent);text-decoration:none}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
nav{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;padding:14px 5vw;background:rgba(15,20,32,.92);border-bottom:1px solid var(--line)}
nav .logo{font-weight:700;color:var(--text)}
nav ul{display:flex;gap:18px;list-style:none;flex-wrap:wrap}
nav ul a{color:var(--muted);font-size:.9rem}
nav ul a:hover{color:var(--accent)}
section{padding:72px 5vw;max-width:1000px;margin:0 auto}
h1{font-size:clamp(2.2rem,7vw,3.8rem);line-height:1.1;margin:10px 0}
h2{font-size:1.8rem;margin-bottom:24px}
.tag-line{color:var(--accent);font-size:.9rem}
.sub{color:var(--muted);font-size:1.1rem;margin-bottom:24px}
.btn{display:inline-block;padding:10px 20px;border-radius:6px;border:1px solid var(--accent);margin-right:10px;margin-bottom:8px;background:none;color:var(--accent);font:inherit;cursor:pointer}
.btn.primary{background:var(--accent);color:#0b1220;font-weight:600}
.about p{margin-bottom:14px;max-width:70ch;color:#cdd5e6}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:14px;margin-top:28px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;text-align:center}
.stat b{display:block;font-size:1.6rem;color:var(--accent)}
.stat span{color:var(--muted);font-size:.85rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:20px}
.card h3{font-size:1.05rem;margin:6px 0}
.card p{color:var(--muted);font-size:.95rem}
.icon{font-size:1.5rem}
.item{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:8px;padding:20px;margin-bottom:16px}
.item .meta{color:var(--accent);font-size:.85rem}
.item h3{margin:4px 0}
.item .org{color:var(--muted);font-size:.95rem;margin-bottom:8px}
.item p{color:#cdd5e6;font-size:.95rem}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chips span{border:1px solid var(--line);border-radius:999px;padding:2px 12px;font-size:.8rem;color:var(--muted)}
.contact-list p{margin-bottom:10px}
form{display:grid;gap:12px;margin-top:24px;max-width:520px}
input,textarea{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 12px;color:var(--text);font:inherit;width:100%}
label{font-size:.85rem;color:var(--muted)}
footer{text-align:center;color:var(--muted);padding:32px 5vw;border-top:1px solid var(--line);font-size:.9rem}
footer a{margin:0 8px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

/* animations */
.hero-wrap{display:flex;align-items:center;justify-content:space-between;gap:40px;flex-wrap:wrap}
.hero-text{flex:1 1 320px}
.photo{position:relative;flex:0 0 auto;width:min(280px,70vw);aspect-ratio:1;margin:0 auto;animation:pop 1s cubic-bezier(.2,.8,.2,1) .3s both}
.photo::before{content:"";position:absolute;inset:-8px;border-radius:50%;border:2px dashed var(--accent);animation:spin 18s linear infinite}
.photo img{width:100%;height:100%;object-fit:cover;object-position:50% 12%;border-radius:50%;display:block;border:4px solid var(--panel);animation:float 5s ease-in-out infinite}
.hero-text>*{animation:up .8s ease both}
.hero-text>*:nth-child(1){animation-delay:.1s}.hero-text>*:nth-child(2){animation-delay:.25s}
.hero-text>*:nth-child(3){animation-delay:.4s}.hero-text>*:nth-child(4){animation-delay:.55s}
.tag-line::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:#4ade80;margin-right:8px;animation:pulse 1.6s infinite}
.reveal{opacity:0;transform:translateY(28px);transition:opacity .7s ease,transform .7s ease}
.reveal.in{opacity:1;transform:none}
.card,.item,.stat,.btn{transition:transform .25s ease,border-color .25s ease,box-shadow .25s ease}
.card:hover,.item:hover,.stat:hover{transform:translateY(-6px);border-color:var(--accent);box-shadow:0 10px 24px rgba(124,196,255,.15)}
.btn:hover{transform:translateY(-2px)}
nav ul a{position:relative}
nav ul a::after{content:"";position:absolute;left:0;bottom:-3px;height:2px;width:0;background:var(--accent);transition:width .25s ease}
nav ul a:hover::after{width:100%}
@keyframes up{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:none}}
@keyframes float{50%{transform:translateY(-10px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{box-shadow:0 0 0 7px rgba(74,222,128,0)}0%{box-shadow:0 0 0 0 rgba(74,222,128,.6)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.reveal{opacity:1;transform:none}}
</style>
</head>
